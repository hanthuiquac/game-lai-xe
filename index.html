<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Xe Vượt Chướng Nại Vật</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #222; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: white; touch-action: manipulation; }
    #game-container { position: relative; width: 320px; height: 450px; background-color: #555; border: 4px solid #fff; overflow: hidden; border-radius: 8px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); }
    .lane-line { position: absolute; left: 50%; transform: translateX(-50%); width: 8px; height: 50px; background-color: #fff; }
    #player { position: absolute; bottom: 20px; left: 135px; width: 50px; height: 80px; background-color: #e74c3c; border-radius: 8px; transition: left 0.1s linear; }
    #player::before { content: ''; position: absolute; top: 15px; left: 5px; width: 40px; height: 20px; background-color: #3498db; border-radius: 4px; }
    .obstacle { position: absolute; width: 50px; height: 80px; background-color: #f1c40f; border-radius: 8px; }
    .obstacle::before { content: ''; position: absolute; bottom: 15px; left: 5px; width: 40px; height: 20px; background-color: #333; border-radius: 4px; }
    #ui { margin-top: 10px; text-align: center; }
    .score-board { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    #mobile-controls { display: flex; gap: 20px; justify-content: center; margin-top: 10px; }
    .btn-control { width: 80px; height: 50px; font-size: 24px; font-weight: bold; background-color: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .btn-control:active { background-color: #2980b9; }
    #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    #game-over-screen h1 { color: #e74c3c; margin-bottom: 10px; }
    #restart-btn { margin-top: 15px; padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="player"></div>
    <div id="game-over-screen">
      <h1>GAME OVER</h1>
      <p id="final-score">Điểm: 0</p>
      <button id="restart-btn" onclick="restartGame()">Chơi Lại</button>
    </div>
  </div>
  <div id="ui">
    <div class="score-board">Điểm: <span id="score">0</span></div>
    <div id="mobile-controls">
      <button class="btn-control" onclick="moveLeft()">◄</button>
      <button class="btn-control" onclick="moveRight()">►</button>
    </div>
  </div>
  <script>
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const scoreElement = document.getElementById('score');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreElement = document.getElementById('final-score');
    const GAME_WIDTH = 320, GAME_HEIGHT = 450, CAR_WIDTH = 50;
    let playerX = 135, playerSpeed = 30, score = 0, speed = 4, isGameOver = false, animationFrameId, obstacles = [], laneLines = [];
    
    for (let i = 0; i < 5; i++) {
      const line = document.createElement('div');
      line.className = 'lane-line';
      line.style.top = (i * 100) + 'px';
      container.appendChild(line);
      laneLines.push(line);
    }
    
    function moveLeft() { if (!isGameOver && playerX > 10) { playerX -= playerSpeed; player.style.left = playerX + 'px'; } }
    function moveRight() { if (!isGameOver && playerX < GAME_WIDTH - CAR_WIDTH - 10) { playerX += playerSpeed; player.style.left = playerX + 'px'; } }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
    });
    
    function spawnObstacle() {
      const obstacle = document.createElement('div');
      obstacle.className = 'obstacle';
      const randomX = Math.floor(Math.random() * (GAME_WIDTH - CAR_WIDTH - 20)) + 10;
      obstacle.style.left = randomX + 'px';
      obstacle.style.top = '-80px';
      container.appendChild(obstacle);
      obstacles.push(obstacle);
    }
    
    function checkCollision(rect1, rect2) {
      return !(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom);
    }
    
    let spawnTimer = 0;
    function gameLoop() {
      if (isGameOver) return;
      laneLines.forEach(line => {
        let top = parseFloat(line.style.top) + speed;
        if (top >= GAME_HEIGHT) top = -50;
        line.style.top = top + 'px';
      });
      spawnTimer++;
      if (spawnTimer % 80 === 0) spawnObstacle();
      const playerRect = player.getBoundingClientRect();
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        let top = parseFloat(obs.style.top) + speed;
        obs.style.top = top + 'px';
        if (checkCollision(playerRect, obs.getBoundingClientRect())) { endGame(); return; }
        if (top > GAME_HEIGHT) {
          obs.remove(); obstacles.splice(i, 1); score += 10;
          scoreElement.innerText = score;
          if (score % 50 === 0) speed += 0.5;
        }
      }
      animationFrameId = requestAnimationFrame(gameLoop);
    }
    
    function endGame() { isGameOver = true; cancelAnimationFrame(animationFrameId); finalScoreElement.innerText = 'Điểm của bạn: ' + score; gameOverScreen.style.display = 'flex'; }
    function restartGame() {
      obstacles.forEach(obs => obs.remove());
      obstacles = []; score = 0; speed = 4; playerX = 135; spawnTimer = 0; isGameOver = false;
      player.style.left = playerX + 'px'; scoreElement.innerText = score; gameOverScreen.style.display = 'none'; gameLoop();
    }
    gameLoop();
  </script>
</body>
</html>
